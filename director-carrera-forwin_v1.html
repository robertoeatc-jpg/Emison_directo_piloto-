<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forwin · Director de carrera</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0e1716;color:#e8f1ef;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
main{width:min(460px,100%);text-align:center}
h1{font-size:20px;margin:0 0 10px}
#est{border-radius:16px;padding:18px 12px;margin:0 0 14px;font-size:26px;font-weight:900;background:#1f8f4e;color:#fff}
#est.r{background:#d62828}
#est small{display:block;font-size:14px;font-weight:600;margin-top:6px;opacity:.9}
.p{display:none}.p.on{display:block}
button{width:100%;margin:8px 0;padding:22px;border:0;border-radius:16px;font-size:24px;font-weight:900;color:#fff;background:#26302e}
#b1,#b3{background:#d62828}#b2,#bv{background:#1f8f4e}#bc{background:#3a4644;font-size:18px;padding:14px}
.txt{font-size:22px;font-weight:700;margin:12px 0;line-height:1.3}
#net{margin-top:14px;font-size:15px;min-height:2.6em}
#net.ok{color:#7bed9f}#net.er{color:#ff6b6b;font-weight:800}#net.wa{color:#ffd60a}
#cn{margin-top:6px;font-size:12px;color:#9db3ae}
</style></head><body><main>
<h1>🏁 Forwin · Director de carrera</h1>
<div id="est">ESTADO: BANDERA VERDE<small id="est2"></small></div>
<div id="p0" class="p on"><button id="b1">BANDERA ROJA</button></div>
<div id="p1" class="p"><div class="txt">Usted acepta que es el director de carrera oficial.</div><button id="b2">ACEPTAR</button><button id="bc" class="bc">CANCELAR</button></div>
<div id="p2" class="p"><div class="txt">Se enviará la bandera roja a todos los pilotos.</div><button id="b3">SACAR BANDERA ROJA</button><button class="bc" id="bc2">CANCELAR</button></div>
<div id="pv" class="p"><button id="bv">RETIRAR BANDERA ROJA</button></div>
<div id="net"></div><div id="cn"></div>
</main>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search),db=(q.get('d')||'').replace(/\/+$/,''),
 okDb=/^https:\/\/[a-z0-9-]+(-default-rtdb)?(\.[a-z0-9-]+)?\.(firebasedatabase\.app|firebaseio\.com)$/i.test(db);
var $=function(s){return document.querySelector(s)},url=db+'/dir.json';
var cur=null,pend=null,lastOk=0,lastTry=0,KC=String(q.get('k')||'');
function hm(t){var d=new Date(t),p=function(n){return String(n).padStart(2,'0')};return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function net(t,c){var e=$('#net');e.textContent=t;e.className=c||''}
function red(){return !!(cur&&cur.s==='r'&&isFinite(+cur.ts)&&Date.now()-cur.ts<43200000)}
function show(p){['p0','p1','p2','pv'].forEach(function(i){$('#'+i).className='p'+(i===p?' on':'')})}
function paint(){
 var r=pend?pend.s==='r':red();
 $('#est').className=r?'r':'';
 $('#est').firstChild.textContent=r?'ESTADO: BANDERA ROJA':'ESTADO: BANDERA VERDE';
 $('#est2').textContent=pend?'orden en envío…':(cur&&cur.id?((cur.s==='r'?'Activada ':'Retirada ')+(cur.auto?'automáticamente ':'')+'a las '+hm(cur.ts)):'');
 if(r)show('pv');else if($('#pv').className.indexOf('on')>=0)show('p0')}
/* paso 1 → 2 → 3 */
$('#b1').onclick=function(){show('p1')};
$('#b2').onclick=function(){show('p2')};
$('#bc').onclick=$('#bc2').onclick=function(){show('p0')};
$('#b3').onclick=function(){send('r')};
$('#bv').onclick=function(){send('v')};
/* envío con reintento hasta que quede guardado */
function send(s){var ts=Date.now(),o={s:s,ts:ts,id:(s==='r'?'r':'v')+ts.toString(36),n:ts,k:KC};pend=o;paint();net('ENVIANDO…','wa');attempt(o)}
function attempt(o){if(pend!==o)return;lastTry=Date.now();
 fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);
  if(pend!==o)return;pend=null;cur=o;lastOk=Date.now();net('ORDEN GUARDADA Y ENVIADA A LOS PILOTOS ✔ '+hm(Date.now()),'ok');paint()
 }).catch(function(e){if(pend!==o)return;net('NO ENVIADA · REINTENTANDO… (comprueba la cobertura)','er');setTimeout(function(){attempt(o)},2000)})}
/* estado actual: se consulta al abrir y cada 3 s (para ver también la retirada automática del panel) */
function poll(){if(pend)return;fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  if(pend)return;var o=d&&typeof d==='object'&&String(d.k||'')===KC?d:null;if(o&&cur&&isFinite(+o.ts)&&+o.ts<+cur.ts)return;
  var changed=JSON.stringify(o)!==JSON.stringify(cur);cur=o;lastOk=Date.now();if(changed)paint();$('#cn').textContent='Conectado · última lectura '+hm(Date.now())
 }).catch(function(){$('#cn').textContent='Sin conexión con la base de datos'+(lastOk?' · última lectura '+hm(lastOk):'')})}
if(!okDb){net('Enlace no válido: falta la dirección de la base de datos (?d=…).','er');['b1','b2','b3','bv'].forEach(function(i){$('#'+i).disabled=true})}
else{poll();setInterval(poll,3000)}
paint();
})();
</script></body></html>
